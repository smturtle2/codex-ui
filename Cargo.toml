[package]
name = "webpty"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "webpty"
path = "rust-src/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["http1", "ws"] }
clap = { version = "4.5.53", features = ["derive"] }
futures-util = "0.3.31"
include_dir = "0.7.4"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.6", features = ["fs"] }
